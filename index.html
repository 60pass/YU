<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yu 交易視界</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #ffffff; color: #1a1a1a; line-height: 1.5; overflow-x: hidden;
  }
  .page-main {
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; background: #ffffff; padding-bottom: 40px;
  }
  .hero-chart { width: 100vw; aspect-ratio: 16/9; max-height: 60vh; overflow: hidden; }
  .hero-chart img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .main-title {
    font-size: 30px; font-weight: 800; letter-spacing: 5px;
    font-style: italic; text-align: center; color: #111;
    margin-top: 16px;
  }
  .menu-list { display: flex; flex-direction: column; gap: 10px; width: 340px; margin-top: 36px; }
  .menu-btn {
    display: flex; align-items: center; justify-content: center;
    padding: 14px 24px; background: #ffffff;
    border: 1px solid #d0d0d0; border-radius: 8px;
    cursor: pointer; transition: all 0.25s ease;
    font-size: 15px; font-weight: 600; letter-spacing: 3px; color: #1a1a1a;
  }
  .menu-btn:hover {
    background: #111; border-color: #111; color: #fff;
    transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  @media (prefers-reduced-motion: no-preference) {
    .fade-in { animation: fadeIn 0.5s ease-out both; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.2s; } .d3 { animation-delay: 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  }
  @media (max-width: 700px) { .menu-list { width: 90%; } }
</style>
</head>
